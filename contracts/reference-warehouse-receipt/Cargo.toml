[package]
name = "ossify-reference-warehouse-receipt"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
ossify-rwa-trait = { path = "../trait" }
ossify-registry = { version = "0.1.0", path = "../registry" }

[lib]
crate-type = ["cdylib", "rlib"]
[features]
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ossify-registry = { path = "../registry", features = ["testutils"] }
ossify-reference-rwa = { path = "../reference-rwa", features = ["testutils"] }
