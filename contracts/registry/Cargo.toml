[package]
name = "ossify-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
ossify-rwa-trait = { path = "../trait" }

[lib]
crate-type = ["cdylib", "rlib"]
[features]
testutils = ["soroban-sdk/testutils"]

[dev-dependencies]
proptest = "1.12.0"
soroban-sdk = { workspace = true, features = ["testutils"] }
